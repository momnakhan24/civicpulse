apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: civicpulse

resources:
  - ../../base

# cd.yml runs, before `kubectl apply -k .`:
#   kustomize edit set image \
#     ghcr.io/momnakhan24/civicpulse-backend=ghcr.io/momnakhan24/civicpulse-backend:${{ github.sha }} \
#     ghcr.io/momnakhan24/civicpulse-frontend=ghcr.io/momnakhan24/civicpulse-frontend:${{ github.sha }}
# so production is always deployed by immutable commit SHA, never :latest.
images:
  - name: ghcr.io/momnakhan24/civicpulse-backend
    newTag: placeholder
  - name: ghcr.io/momnakhan24/civicpulse-frontend
    newTag: placeholder
