apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: civicpulse
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: ghcr.io/momnakhan24/civicpulse-backend:placeholder
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          resources:
            # Required for the HPA: CPU utilization is usage ÷ request. No request,
            # no denominator, HPA sits at <unknown>/60% forever.
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            # Slow start is not failure — this is what stops restart loops on boot.
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            # Restarts the pod — must NOT depend on the database.
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          readinessProbe:
            # Removes the pod from the Service — SHOULD depend on the database.
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                # Give the pod time to leave the Service endpoints before it stops
                # accepting connections, so a rolling update drops zero requests.
                command: ["sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: civicpulse
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
