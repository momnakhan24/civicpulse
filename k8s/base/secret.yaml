# Placeholders only. Never put a real credential in this file.
# cd.yml overwrites these at deploy time, e.g.:
#   kubectl create secret generic backend-secret -n civicpulse \
#     --from-literal=POSTGRES_PASSWORD=$POSTGRES_PASSWORD \
#     --from-literal=DATABASE_URL=$DATABASE_URL \
#     --from-literal=GROQ_API_KEY=$GROQ_API_KEY \
#     --dry-run=client -o yaml | kubectl apply -f -
# with the real values coming from GitHub Secrets, never from this file.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: civicpulse
type: Opaque
stringData:
  POSTGRES_PASSWORD: "changeme"
  DATABASE_URL: "postgresql+psycopg://civicpulse:changeme@postgres:5432/civicpulse"
  GROQ_API_KEY: "changeme"
